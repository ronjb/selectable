name: selectable
description: A Flutter widget that enables text selection over all the text widgets it contains.
version: 0.7.1
repository: https://github.com/ronjb/selectable

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  characters: ^1.2.0
  collection: ^1.16.0
  cupertino_ui: ^1.0.1
  equatable: ^2.0.5
  float_column: ^4.1.3
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  url_launcher: ^6.1.7

dev_dependencies:
  flutter_lints_plus: ^3.2.0
  flutter_test:
    sdk: flutter